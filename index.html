<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>まちがいさがし２</title>
    <meta property="og:title" content="まちがいさがし２">
    <meta property="og:description" content="【自立活動】見る力を鍛えるまちがいさがしアプリです。">
    <meta property="og:type" content="website">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: M PLUS Rounded 1c -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #0f172a;
            touch-action: manipulation;
            user-select: none;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .card-hover {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.2);
        }
        .card-hover:active {
            transform: translateY(0) scale(0.98);
        }
        @keyframes stampPop {
            0% { transform: scale(3) rotate(-15deg); opacity: 0; }
            50% { transform: scale(0.9) rotate(-5deg); opacity: 1; }
            70% { transform: scale(1.05) rotate(-5deg); }
            100% { transform: scale(1) rotate(-5deg); opacity: 1; }
        }
        .animate-stamp {
            animation: stampPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes redCirclePop {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.25); opacity: 1; }
            80% { transform: scale(0.9); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-red-circle {
            animation: redCirclePop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
    </style>
</head>
<body class="p-1 sm:p-2 md:p-3">

    <!-- 16:9 Main Aspect Ratio Container -->
    <div class="w-full h-full max-w-[177.78vh] max-h-[100vh] aspect-video bg-slate-100 rounded-2xl shadow-2xl overflow-hidden border-4 border-slate-700 flex flex-col justify-between select-none">

        <!-- Top Navigation Bar -->
        <div class="bg-slate-900 text-white px-2 py-1 flex items-center justify-between gap-2 border-b-2 border-slate-800 shrink-0 h-10">
            <!-- Theme Tabs -->
            <div id="themeTabsContainer" class="flex items-center gap-1 overflow-x-auto no-scrollbar py-0.5 flex-1 h-full">
                <!-- Dynamic Theme Tabs -->
            </div>

            <!-- Top Right Settings -->
            <div class="flex items-center gap-2 shrink-0">
                <!-- Card Count Switcher -->
                <div class="bg-slate-800 p-0.5 rounded-lg border border-slate-700 flex text-[11px] font-bold">
                    <button id="btn4" onclick="setCardCount(4)" class="px-2 py-0.5 rounded transition-all bg-sky-500 text-white shadow">4まい</button>
                    <button id="btn9" onclick="setCardCount(9)" class="px-2 py-0.5 rounded transition-all text-slate-300 hover:text-white">9まい</button>
                    <button id="btn12" onclick="setCardCount(12)" class="px-2 py-0.5 rounded transition-all text-slate-300 hover:text-white">12まい</button>
                </div>
                <!-- Lap Counter Badge -->
                <div id="lapBadge" class="bg-amber-500 text-slate-900 font-extrabold px-2.5 py-0.5 rounded-lg text-xs shadow border border-amber-300">
                    1しゅうめ
                </div>
            </div>
        </div>

        <!-- Sub-Header Status & Control Bar -->
        <div class="bg-slate-200/90 px-3 py-1 flex items-center justify-between gap-2 border-b border-slate-300 text-xs font-bold shrink-0 h-9">
            <div class="flex items-center gap-2 overflow-hidden">
                <span class="bg-slate-800 text-white text-[11px] font-black px-2 py-0.5 rounded shadow-sm shrink-0">
                    見る力をつけよう
                </span>
                <span id="currentThemeTitle" class="text-slate-800 font-black text-xs sm:text-sm truncate shrink-0">
                    ① イルカのおやこ
                </span>
                <div class="hidden md:flex items-center bg-white px-2 py-0.5 rounded-full border border-sky-300 text-[11px] text-slate-700 shadow-sm gap-1 truncate">
                    <span class="bg-sky-500 text-white px-1 py-0.2 rounded text-[10px] font-extrabold">ルール</span>
                    <span>1 (もとのえ) と <strong class="text-amber-600">【全くおなじ絵】</strong> を探すか、<strong class="text-rose-500">【ちがう部分】</strong> をタップ！</span>
                </div>
            </div>

            <!-- Right Controls -->
            <div class="flex items-center gap-1.5 shrink-0">
                <!-- Found Counter -->
                <div class="bg-emerald-50 text-emerald-800 border border-emerald-300 px-2.5 py-0.5 rounded-lg flex items-center gap-1 text-xs font-black shadow-sm">
                    <span class="text-emerald-700">🔍 みつけた:</span>
                    <span id="scoreText" class="text-emerald-600 text-sm font-extrabold">0 / 11</span>
                </div>

                <!-- Next Button -->
                <button onclick="nextTheme()" class="bg-sky-500 hover:bg-sky-600 active:scale-95 text-white font-extrabold px-2.5 py-1 rounded-lg shadow border border-sky-400 flex items-center gap-1 text-xs transition-all">
                    <span>つぎへ</span>
                    <span>❯</span>
                </button>

                <!-- Sound Toggle -->
                <button id="soundBtn" onclick="toggleSound()" title="音のオン/オフ" class="bg-slate-300 hover:bg-slate-400 text-slate-700 px-2 py-1 rounded-lg shadow border border-slate-400 text-xs transition-all">
                    🔊
                </button>

                <!-- Reset Button -->
                <button onclick="resetCurrentGame()" title="シャッフルやりなおす" class="bg-slate-300 hover:bg-slate-400 text-slate-700 px-2 py-1 rounded-lg shadow border border-slate-400 text-xs transition-all">
                    🔄
                </button>
            </div>
        </div>

        <!-- Main Cards Grid Area -->
        <div class="p-1.5 sm:p-2 bg-slate-300 flex-1 overflow-hidden">
            <div id="cardsGrid" class="h-full w-full grid gap-1.5 sm:gap-2">
                <!-- Dynamic cards rendered here -->
            </div>
        </div>
    </div>

    <!-- Success Modal Overlay -->
    <div id="successModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl border-4 border-amber-400 transform transition-all">
            <div class="text-6xl mb-2">🎉</div>
            <h3 class="text-2xl font-black text-slate-800 mb-1">ぜんぶ できたね！</h3>
            <p class="text-sm font-bold text-slate-600 mb-4">おなじ絵も ちがう部分も ぜんぶみつけられたよ！</p>
            
            <div id="modalCardPreview" class="w-32 h-32 mx-auto mb-4 bg-sky-50 rounded-2xl border-2 border-sky-200 p-2 shadow-inner flex items-center justify-center"></div>

            <button onclick="closeModalNext()" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-black text-lg py-3 rounded-2xl shadow-lg active:scale-95 transition-all">
                つぎの もんだいへ 🚀
            </button>
        </div>
    </div>

    <!-- Game Logic & SVG Renderer -->
    <script>
        const themes = [
            { id: 'dinosaur', num: '1', symbol: '①', name: 'きょうりゅうとたまご' },
            { id: 'castle', num: '2', symbol: '②', name: 'おしろ' },
            { id: 'bakery', num: '3', symbol: '③', name: 'おかしやさん' },
            { id: 'ocean', num: '4', symbol: '④', name: 'うみのいきもの' },
            { id: 'racing', num: '5', symbol: '⑤', name: 'レーシングカー' },
            { id: 'penguin', num: '6', symbol: '⑥', name: 'ペンギンのおやこ' },
            { id: 'festival', num: '7', symbol: '⑦', name: 'なつまつり' }
        ];

        // Global Game State
        let currentThemeIndex = 0;
        let cardCount = 4;
        let correctIndex = -1;
        let foundCards = new Set();
        let lapCount = 1;
        let soundEnabled = true;
        let activeCardConfigs = {};


        // Chromebook / touch screen: do not show browser context menus on right-click or long/double interaction.
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('dblclick', event => event.preventDefault());

        // Sound System (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!soundEnabled) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const now = audioCtx.currentTime;

            if (type === 'found') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now); // D5
                osc.frequency.exponentialRampToValueAtTime(1174.66, now + 0.12); // D6
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.18);
            } else if (type === 'correct') {
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.07);
                    gain.gain.setValueAtTime(0.25, now + idx * 0.07);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.25);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.07);
                    osc.stop(now + idx * 0.07 + 0.25);
                });
            } else if (type === 'wrong') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.setValueAtTime(130, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.22);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundBtn').innerText = soundEnabled ? '🔊' : '🔇';
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderThemeTabs();
            generateGame();
        });

        function renderThemeTabs() {
            const container = document.getElementById('themeTabsContainer');
            container.innerHTML = '';

            themes.forEach((theme, idx) => {
                const btn = document.createElement('button');
                const isActive = idx === currentThemeIndex;
                btn.className = `flex items-center gap-1 px-2 py-1 rounded-lg font-bold text-xs shrink-0 transition-all cursor-pointer ${
                    isActive 
                    ? 'bg-sky-500 text-white shadow-md ring-1 ring-sky-300' 
                    : 'bg-slate-800 hover:bg-slate-700 text-slate-300'
                }`;
                btn.onclick = () => selectTheme(idx);
                btn.innerHTML = `
                    <span class="whitespace-nowrap">${theme.symbol} ${theme.name}</span>
                `;
                container.appendChild(btn);
            });

            const curr = themes[currentThemeIndex];
            document.getElementById('currentThemeTitle').innerText = `${curr.symbol} ${curr.name}`;
            updateScoreText();
            document.getElementById('lapBadge').innerText = `${lapCount}しゅうめ`;
        }

        function updateScoreText() {
            const totalToFind = cardCount - 1;
            document.getElementById('scoreText').innerText = `${foundCards.size} / ${totalToFind}`;
        }

        function selectTheme(index) {
            currentThemeIndex = index;
            renderThemeTabs();
            generateGame();
        }

        function setCardCount(count) {
            cardCount = count;
            ['btn4', 'btn9', 'btn12'].forEach(id => {
                const btn = document.getElementById(id);
                const selected = Number(id.replace('btn', '')) === count;
                btn.className = selected
                    ? 'px-2 py-0.5 rounded transition-all bg-sky-500 text-white shadow'
                    : 'px-2 py-0.5 rounded transition-all text-slate-300 hover:text-white';
            });
            generateGame();
        }

        function nextTheme() {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            if (currentThemeIndex === 0) {
                lapCount++;
            }
            renderThemeTabs();
            generateGame();
        }

        function resetCurrentGame() {
            generateGame();
        }

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // 7テーマそれぞれに、絵の形や部品そのものが変わる20種類の間違いを用意
        const variationSpots = [
          [100,65,18],[135,72,18],[75,105,18],[120,120,18],[45,145,17],
          [155,145,17],[95,95,16],[60,65,16],[145,45,16],[100,150,17],
          [35,100,17],[165,100,17],[80,45,15],[120,45,15],[55,125,16],
          [145,125,16],[100,35,15],[35,160,15],[165,160,15],[100,100,20]
        ];
        const diffNames = ['eye','mouth','body','tail','spot','egg','wing','roof','window','flower','leaf','cheek','cloud','hat','belly','wheel','scarf','lantern','cupcake','shape'];
        const themeVariations = {};
        const visibleVariationTypes = {};
        themes.forEach(theme => {
          themeVariations[theme.id] = diffNames.map((name, i) => ({ diffType: `${name}_${i}`, spot: { cx: variationSpots[i][0], cy: variationSpots[i][1], r: variationSpots[i][2] } }));
          visibleVariationTypes[theme.id] = diffNames.map((name, i) => `${name}_${i}`);
        });

        let gameGenerationToken = 0;
        async function svgPixelSignature(svgText) {
            const pixels = await svgToPixels(svgText);
            // Compare the rendered pixels, not SVG text: visually identical SVGs must be treated as duplicates.
            let hash = 2166136261;
            for (let i = 0; i < pixels.length; i += 4) {
                hash ^= pixels[i]; hash = Math.imul(hash, 16777619);
                hash ^= pixels[i + 1]; hash = Math.imul(hash, 16777619);
                hash ^= pixels[i + 2]; hash = Math.imul(hash, 16777619);
                hash ^= pixels[i + 3]; hash = Math.imul(hash, 16777619);
            }
            return `${hash >>> 0}:${pixels.length}`;
        }

        async function generateGame() {
            const thisGeneration = ++gameGenerationToken;
            foundCards.clear();
            activeCardConfigs = {};
            updateScoreText();

            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            if (cardCount === 4) {
                grid.className = "h-full w-full grid grid-cols-2 grid-rows-2 gap-2 sm:gap-3";
            } else if (cardCount === 12) {
                grid.className = "h-full w-full grid grid-cols-4 grid-rows-3 gap-1.5 sm:gap-2";
            } else {
                grid.className = "h-full w-full grid grid-cols-3 grid-rows-3 gap-1.5 sm:gap-2";
            }

            const activeTheme = themes[currentThemeIndex].id;
            const totalSelectableCards = cardCount - 1;
            correctIndex = Math.floor(Math.random() * totalSelectableCards) + 2;

            const rawVars = themeVariations[activeTheme] || themeVariations['dolphin'];
            const preferredTypes = visibleVariationTypes[activeTheme] || visibleVariationTypes.dolphin;
            const originalSvg = drawIllustration(activeTheme, { isOriginal: true }, false);

            // 実際のSVGをラスタライズし、画素のハッシュで重複を判定する。
            // diffType名が違っても見た目が同じなら採用せず、元絵と同じ絵も除外する。
            const seenPixelSignatures = new Set([await svgPixelSignature(originalSvg)]);
            const seenDiffTypes = new Set();
            const uniqueVars = [];
            const orderedTypes = [...preferredTypes];
            for (const type of orderedTypes) {
                if (thisGeneration !== gameGenerationToken) return;
                if (seenDiffTypes.has(type)) continue;
                const item = rawVars.find(v => v.diffType === type);
                if (!item) continue;
                const rendered = drawIllustration(activeTheme, { isOriginal: false, diffType: item.diffType }, false);
                let signature;
                try { signature = await svgPixelSignature(rendered); }
                catch (error) { console.error('SVGの描画比較に失敗しました', error); continue; }
                // 画面に描画した結果が元絵や他の差分と同じなら、候補から除外する。
                if (seenPixelSignatures.has(signature)) continue;
                seenDiffTypes.add(type);
                seenPixelSignatures.add(signature);
                uniqueVars.push(item);
            }
            if (thisGeneration !== gameGenerationToken) return;

            const shuffledVars = shuffleArray(uniqueVars);
            const requiredDifferences = cardCount - 2; // 4枚なら2種類、9枚なら7種類、12枚なら10種類
            if (shuffledVars.length < requiredDifferences) {
                console.error(`重複なしで用意できる差分が不足しています: ${activeTheme}。必要=${requiredDifferences}、利用可能=${shuffledVars.length}`);
                grid.innerHTML = `<div class="col-span-full flex items-center justify-center rounded-xl bg-amber-50 p-6 text-center font-bold text-amber-900">このテーマの間違いパターンが不足しています。重複した絵は出さず、別のテーマを選んでください。</div>`;
                return;
            }

            // 1. Target Card
            activeCardConfigs[1] = { isOriginal: true };
            const card1 = document.createElement('div');
            card1.className = 'bg-white rounded-xl border-2 border-sky-400 overflow-hidden shadow flex flex-col justify-between relative h-full';
            card1.innerHTML = `
                <div class="bg-sky-500 text-white px-2 py-0.5 text-[11px] font-black flex items-center gap-1 shrink-0">
                    <span>👑</span>
                    <span>1 もとのえ</span>
                </div>
                <div class="p-1 bg-sky-50/50 flex-1 flex items-center justify-center overflow-hidden">
                    <div class="w-full h-full ${cardCount === 4 ? 'max-w-[min(42vh,42vw)] max-h-[min(42vh,42vw)]' : 'max-w-[150px] max-h-[150px]'} aspect-square flex items-center justify-center">
                        ${drawIllustration(activeTheme, { isOriginal: true })}
                    </div>
                </div>
                <div class="bg-sky-100 text-sky-800 text-center py-0.5 text-[10px] sm:text-[11px] font-bold border-t border-sky-200 shrink-0">
                    ✓ これを みくらべる
                </div>
            `;
            grid.appendChild(card1);

            // 2. Option Cards
            let varIdx = 0;
            for (let cardNum = 2; cardNum <= cardCount; cardNum++) {
                const isCorrect = (cardNum === correctIndex);
                let diffConfig;

                if (isCorrect) {
                    diffConfig = { isOriginal: true };
                } else {
                    const item = shuffledVars[varIdx];
                    varIdx++;
                    // 候補不足時のダミー絵は作らない。事前の画素比較で必要数を確保している。
                    if (!item) return;
                    diffConfig = {
                        isOriginal: false,
                        diffType: item.diffType,
                        spot: item.spot
                    };
                }

                activeCardConfigs[cardNum] = diffConfig;

                const cardEl = document.createElement('div');
                cardEl.className = 'card-hover bg-white rounded-xl border-2 border-slate-300 overflow-hidden shadow-sm flex flex-col justify-between relative group cursor-pointer h-full';
                cardEl.id = `card-${cardNum}`;

                cardEl.innerHTML = `
                    <div class="absolute top-1 left-1 z-10 bg-slate-800 text-white font-black text-[11px] w-5 h-5 rounded-md flex items-center justify-center shadow">
                        ${cardNum}
                    </div>

                    <div class="p-1 pt-4 bg-white flex-1 flex items-center justify-center overflow-hidden" onclick="handleCardClick(event, ${cardNum})">
                        <div id="img-container-${cardNum}" class="w-full h-full ${cardCount === 4 ? 'max-w-[min(42vh,42vw)] max-h-[min(42vh,42vw)]' : 'max-w-[150px] max-h-[150px]'} aspect-square flex items-center justify-center relative">
                            ${drawIllustration(activeTheme, diffConfig, false)}
                        </div>
                    </div>

                    <div id="stamp-${cardNum}" class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-0 z-20">
                        <div class="w-20 h-20 border-4 border-emerald-500 text-emerald-600 rounded-full flex items-center justify-center font-black text-[11px] border-dashed transform -rotate-12 bg-white/95 shadow-xl text-center leading-tight">
                            たいへん<br>よくできました
                        </div>
                    </div>

                    <button onclick="handleMatchBtnClick(${cardNum})" class="w-full bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 active:scale-98 text-slate-900 font-extrabold py-1 px-1 text-[11px] sm:text-xs flex items-center justify-center gap-0.5 border-t border-amber-300 shadow-inner shrink-0">
                        <span>★ ★ これがおなじえ！</span>
                    </button>
                `;

                grid.appendChild(cardEl);
            }
        }

        function handleCardClick(event, cardNum) {
            if (foundCards.has(cardNum)) return;
            // 「同じ絵」は絵をタップしても正解にしない。
            // どの絵でも、絵をタップする操作自体は不正解音にする。
            if (cardNum === correctIndex) {
                playSound('wrong');
                return;
            }
            const config = activeCardConfigs[cardNum];
            if (!config) return;
            const svg = event.currentTarget.querySelector('svg');
            if (!svg) return;
            const matrix = svg.getScreenCTM();
            if (!matrix) return;
            const point = svg.createSVGPoint();
            point.x = event.clientX;
            point.y = event.clientY;
            const svgPoint = point.matrixTransform(matrix.inverse());

            // 汎用の目印位置ではなく、元絵と実際のSVGを画素比較して、
            // 本当に絵が変わっている場所をタップしたときだけ正解にする。
            isTapOnActualDifference(themes[currentThemeIndex].id, config, svgPoint.x, svgPoint.y)
                .then(isDifference => {
                    if (foundCards.has(cardNum)) return;
                    if (isDifference) {
                        const tappedSpot = { cx: svgPoint.x, cy: svgPoint.y, r: 12 };
                        markCardAsFound(cardNum, false, tappedSpot);
                    } else {
                        playSound('wrong');
                    }
                })
                .catch(() => playSound('wrong'));
        }

        const differenceHitCache = new Map();

        function svgToPixels(svgText) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 200;
                    canvas.height = 200;
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    ctx.drawImage(img, 0, 0, 200, 200);
                    try {
                        resolve(ctx.getImageData(0, 0, 200, 200).data);
                    } catch (e) { reject(e); }
                };
                img.onerror = reject;
                const svgWithSize = svgText.replace('<svg ', '<svg width="200" height="200" ');
                img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgWithSize)));
            });
        }

        async function isTapOnActualDifference(theme, config, x, y) {
            const key = `${theme}|${config.diffType || 'original'}`;
            let mask = differenceHitCache.get(key);
            if (!mask) {
                const originalSvg = drawIllustration(theme, { isOriginal: true }, false);
                const changedSvg = drawIllustration(theme, config, false);
                const [originalPixels, changedPixels] = await Promise.all([
                    svgToPixels(originalSvg), svgToPixels(changedSvg)
                ]);
                mask = new Uint8Array(200 * 200);
                for (let py = 0; py < 200; py++) {
                    for (let px = 0; px < 200; px++) {
                        const i = (py * 200 + px) * 4;
                        const delta = Math.abs(originalPixels[i] - changedPixels[i]) +
                                      Math.abs(originalPixels[i+1] - changedPixels[i+1]) +
                                      Math.abs(originalPixels[i+2] - changedPixels[i+2]) +
                                      Math.abs(originalPixels[i+3] - changedPixels[i+3]);
                        if (delta > 30) mask[py * 200 + px] = 1;
                    }
                }
                differenceHitCache.set(key, mask);
            }
            const cx = Math.round(x), cy = Math.round(y);
            // タップ誤差を少し許容する。違いの輪郭から最大4px以内なら反応。
            for (let dy = -7; dy <= 7; dy++) {
                for (let dx = -7; dx <= 7; dx++) {
                    if (dx*dx + dy*dy > 49) continue;
                    const px = cx + dx, py = cy + dy;
                    if (px >= 0 && px < 200 && py >= 0 && py < 200 && mask[py * 200 + px]) return true;
                }
            }
            return false;
        }

        function handleMatchBtnClick(cardNum) {
            if (foundCards.has(cardNum)) return;
            // オレンジ色の「これがおなじえ！」バーだけが、
            // 同じ絵を正解にできる操作。
            const isCorrect = (cardNum === correctIndex);
            if (isCorrect) {
                markCardAsFound(cardNum, true);
            } else {
                playSound('wrong');
                const cardEl = document.getElementById(`card-${cardNum}`);
                cardEl.classList.add('translate-x-1');
                setTimeout(() => cardEl.classList.remove('translate-x-1'), 80);
                setTimeout(() => cardEl.classList.add('-translate-x-1'), 160);
                setTimeout(() => cardEl.classList.remove('-translate-x-1'), 240);
            }
        }

        function markCardAsFound(cardNum, isCorrect, tappedSpot = null) {
            foundCards.add(cardNum);
            updateScoreText();

            const cardEl = document.getElementById(`card-${cardNum}`);
            const imgContainer = document.getElementById(`img-container-${cardNum}`);
            const diffConfig = activeCardConfigs[cardNum];

            if (isCorrect) {
                playSound('correct');
                const stamp = document.getElementById(`stamp-${cardNum}`);
                if (stamp) {
                    stamp.classList.remove('opacity-0');
                    stamp.classList.add('animate-stamp');
                }
                cardEl.classList.remove('border-slate-300');
                cardEl.classList.add('border-emerald-500', 'ring-2', 'ring-emerald-300');
            } else {
                playSound('found');
                const activeTheme = themes[currentThemeIndex].id;
                imgContainer.innerHTML = drawIllustration(activeTheme, { ...diffConfig, spot: tappedSpot || diffConfig.spot }, true);

                cardEl.classList.remove('border-slate-300');
                cardEl.classList.add('border-rose-400', 'bg-rose-50/20');
            }

            const totalToFind = cardCount - 1;
            if (foundCards.size === totalToFind) {
                confetti({
                    particleCount: 100,
                    spread: 80,
                    origin: { y: 0.6 }
                });

                setTimeout(() => {
                    const modalPreview = document.getElementById('modalCardPreview');
                    modalPreview.innerHTML = drawIllustration(themes[currentThemeIndex].id, { isOriginal: true }, false);
                    document.getElementById('successModal').classList.remove('hidden');
                }, 600);
            }
        }

        function closeModalNext() {
            document.getElementById('successModal').classList.add('hidden');
            nextTheme();
        }
